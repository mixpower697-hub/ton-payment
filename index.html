<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATI Token Sale</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#0b1220,#111827,#0f172a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

.card{

width:380px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:30px;
text-align:center;
box-shadow:0 0 35px rgba(0,180,255,.25);

}

.logo{

width:80px;
height:80px;
margin:auto;
border-radius:50%;
background:#1d4ed8;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;

}

h1{

margin-top:20px;
font-size:30px;

}

.subtitle{

margin-top:10px;
color:#9ca3af;
font-size:15px;

}

.input{

margin-top:25px;

}

input{

width:100%;
padding:15px;
border-radius:12px;
border:none;
outline:none;
background:#1f2937;
color:white;
font-size:18px;
text-align:center;

}

#tokens{

margin-top:20px;
font-size:22px;
font-weight:bold;
color:#60a5fa;

}

button{

margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#1d4ed8;

}

.info{

margin-top:25px;
font-size:13px;
color:#9ca3af;
line-height:22px;

}

.footer{

margin-top:25px;
font-size:12px;
color:#6b7280;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">🪙</div>

<h1>CATI</h1>

<p class="subtitle">
Secure CATI Purchase
</p>

<div class="input">

<input
id="amount"
type="number"
placeholder="Enter GRAM Amount">

</div>

<div id="tokens">

0 CATI

</div>

<button onclick="pay()">

Buy CATI

</button>

<div class="info">

Exchange Rate<br><br>

<b>50 GRAM = 6,000,000 CATI</b>

</div>

<div class="footer">

Powered by Blockchain Payment

</div>

</div>

<script>

document.getElementById("amount").addEventListener("input",function(){

let amount=parseFloat(this.value)||0;

let tokens=(amount/50)*6000000;

document.getElementById("tokens").innerHTML=

tokens.toLocaleString()+" CATI";

});

function pay(){

let amount=document.getElementById("amount").value;

if(amount==""){

alert("Enter GRAM amount");

return;

}

let wallet="UQD0N_u4lRmmPiLLQdCZFduiiAub7Oh6ftWzIn7D88sumQ_9";

window.location.href=

`ton://transfer/${wallet}?amount=${amount*1000000000}`;

}

</script>

</body>
</html>
