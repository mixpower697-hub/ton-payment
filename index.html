<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CATI Presale</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
radial-gradient(circle at top,#2563eb 0%,#111827 35%,#030712 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;

}

.card{

width:420px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:30px;
box-shadow:0 0 40px rgba(37,99,235,.35);

}

.logo{

width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#38bdf8,#2563eb);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
font-weight:bold;
box-shadow:0 0 25px rgba(59,130,246,.5);

}

h1{

margin-top:18px;
text-align:center;
font-size:34px;

}

.sub{

margin-top:8px;
text-align:center;
color:#cbd5e1;
font-size:14px;

}

.rate{

margin-top:22px;
padding:14px;
border-radius:14px;
background:#1d4ed8;
font-size:18px;
font-weight:bold;
text-align:center;

}

input{

margin-top:22px;
width:100%;
padding:16px;
border:none;
outline:none;
background:#0f172a;
border-radius:14px;
color:white;
font-size:20px;
text-align:center;

}

.receive{

margin-top:22px;
padding:20px;
background:#0f172a;
border-radius:14px;
text-align:center;

}

.receive h2{

margin-top:10px;
font-size:30px;
color:#38bdf8;

}
button{

width:100%;
margin-top:22px;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#3b82f6,#2563eb);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:translateY(-2px);
box-shadow:0 0 20px rgba(59,130,246,.5);

}

.info{

margin-top:20px;
padding:15px;
background:#111827;
border-radius:12px;
border:1px solid rgba(255,255,255,.06);

}

.info p{

display:flex;
justify-content:space-between;
margin:8px 0;
color:#d1d5db;
font-size:14px;

}

.footer{

margin-top:20px;
text-align:center;
font-size:13px;
color:#9ca3af;
line-height:22px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

C

</div>

<h1>CATI</h1>

<p class="sub">

Secure CATI Token Presale

</p>

<div class="rate">

50 GRAM = 6,000,000 CATI

</div>

<input
id="amount"
type="number"
placeholder="Enter GRAM Amount">

<div class="receive">

<p>You Will Receive</p>

<h2 id="tokens">

0 CATI

</h2>

</div>

<div class="info">

<p>
<span>Network</span>
<span>TON</span>
</p>

<p>
<span>Payment</span>
<span>GRAM</span>
</p>

<p>
<span>Status</span>
<span style="color:#22c55e;">● Online</span>
</p>

</div>

<button onclick="pay()">

🚀 BUY CATI

</button>

<div class="footer">

✔ Secure payment via Tonkeeper<br>
✔ Fast blockchain confirmation<br>
✔ Powered by TON Network

</div>

</div>  
<script>

const wallet = "UQD0N_u4lRmmPiLLQdCZFduiiAub7Oh6ftWzIn7D88sumQ_9";

const amountInput = document.getElementById("amount");
const tokensLabel = document.getElementById("tokens");

amountInput.addEventListener("input", function () {

    let amount = parseFloat(this.value) || 0;

    let tokens = (amount / 50) * 6000000;

    tokensLabel.innerHTML = tokens.toLocaleString() + " CATI";

});

function pay() {

    let amount = parseFloat(amountInput.value);

    if (!amount || amount <= 0) {

        alert("Please enter a valid GRAM amount.");

        return;

    }

    const nano = Math.floor(amount * 1000000000);

    window.location.href =
    `ton://transfer/${wallet}?amount=${nano}`;

}

</script>

</body>

</html>
