<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TON Payment</title>
</head>
<body>

<h2>شراء FRT</h2>

<input id="amount" type="number" placeholder="أدخل المبلغ بالـ TON">

<br><br>

<button onclick="pay()">دفع</button>

<script>
function pay() {

let amount = document.getElementById("amount").value;

if(!amount){
alert("أدخل المبلغ");
return;
}

let wallet =
"UQD0N_u4lRmmPiLLQdCZFduiiAub7Oh6ftWzIn7D88sumQ_9";

window.location.href =
`ton://transfer/${wallet}?amount=${amount*1000000000}`;
}
</script>

</body>
</html>
